[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-review-sentiment"
version = "0.1.0"
description = "Amazon Reviews 2023 sentiment-classification artefact"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.4.1,<1.5",
  "joblib>=1.5,<1.7",
  "numpy>=2.0,<2.3",
  "pandas>=2.2.3,<2.4",
  "pyarrow>=21,<26",
  "PyYAML>=6,<7",
  "scikit-learn>=1.6,<1.8",
]

[project.optional-dependencies]
transformer = [
  "accelerate==1.15.0",
  "datasets==5.0.1",
  "huggingface-hub==1.32.0",
  "tokenizers==0.23.2",
  "transformers==5.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
